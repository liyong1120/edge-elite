# ======================================================
#  CS-Godot 配置文件 (TOML 格式，支持 # 注释)
#  修改后保存文件，重启游戏生效
# ======================================================

# ---------- 机器人设置 ----------
[bot]
# 机器人是否允许攻击（含 枪 / 刀 / 手雷 等所有攻击方式）
# true  = 机器人可以正常攻击
# false = 机器人只移动 / 观察，完全不出手（便于观察地图、人物模型、测试）
can_attack = true

# 人机难度：0 = 简单 / 1 = 普通 / 2 = 困难
# 游戏内「开始界面 → 人机难度」选完会写回本项，重启后保留。
# 各难度具体数值见 scripts/bot.gd 顶部的 DIFFICULTY 表。
# 注意：难度主要作用于 bot 的**开火行为**（命中率/反应速度/交战距离/走位速度）；
#       若 can_attack = false（bot 完全不开枪），难度差异会看不出来。
difficulty = 1


# ---------- 玩法参数 ----------
[gameplay]
# 单回合时长（秒）
round_time = 180
# 购买阶段时长（秒）
buy_time = 10
# C4 爆炸倒计时（秒）
bomb_timer = 40


# ---------- 画面设置 ----------
[graphics]
# 视野角度 FOV（度），建议 70~110
fov = 90
# 鼠标灵敏度，数值越大转向越快
mouse_sensitivity = 2.2
# 第一人称是否显示自己的身体模型（低头能看到躯干和腿）
# true  = 显示自己的身体模型。注意：相机在躯干内部，实际观感很差（会看到一堆内部几何），
#         而且这个模型是 A 字站姿、手臂垂着不握枪，不像 CF。不建议开。
# false = 隐藏身体模型（推荐）
# 想看手臂请用下面的 show_fpv_arms —— 手臂已经直接做进第一人称武器模型里了
show_own_body = false
# 第一人称武器是否带握枪手臂（手臂做在武器模型里，会随武器一起动）
# true  = 显示手臂（CF 风格，能看到双手握枪）
# false = 只显示武器本体
#
# 实测（2026-09-28）：开启后画面上**看不到正常的手臂** —— 只多出几块散在外面的蓝色方块。
# 原因是 GLB 里的 `arms` 节点是独立低模，包围盒比枪身宽约 6 倍（x ±0.158 vs 枪身 ±0.025），
# 且袖管被 _tint_arms 染成深蓝，在浅色场景里就是几坨孤立色块，观感反而更差。
# 所以又关掉了。要真做出"双手握枪"，得换一套带正确手部姿态的武器素材。
show_fpv_arms = false


# ---------- 音频设置 ----------
[audio]
# 主音量（0.0 ~ 1.0）
master_volume = 1.0
# 音效音量（枪声、脚步声等，0.0 ~ 1.0）
sfx_volume = 1.0
# 背景音乐音量（0.0 ~ 1.0）
music_volume = 0.5


# ---------- 弹道特效 ----------
[effects]
# --- 曳光（GTA 罪恶都市风格：屏幕空间的一段亮色短线沿真实弹道飞过）---
# 线宽（像素），建议 2 ~ 5。屏幕空间画线，不受距离影响
tracer_width_px = 3.0
# 飞行速度（米/秒），建议 100 ~ 250。数值越小飞得越慢、看得越清楚
# （真实子弹约 700，但那样一帧就飞完，屏幕上看不到过程）
tracer_speed = 150.0
# 淡出时长（秒）：短段飞到命中点后淡出所花时间，建议 0.03 ~ 0.10
tracer_lifetime = 0.06
# 颜色（R, G, B），取值 0~255。
# GTA 罪恶都市风格：淡黄偏白 [255, 242, 180]
# 其他备选：暖黄 [255, 230, 140]；CF 橙黄 [255, 217, 102]；纯白 [255, 252, 235]
tracer_color = [255, 242, 180]
# 以下两项已弃用（曳光改为屏幕空间绘制，粗细/亮度由上面的参数控制）
# tracer_radius = 0.028
# tracer_brightness = 3.2
# tracer_muzzle_offset = 0.6
# tracer_visible_offset = 1.15

# --- 弹孔（凹在墙里的暗痕）---
# 弹孔半径（米），控制 Decal 投影范围，建议 0.04 ~ 0.10
hitmarker_radius = 0.05
# 厚度（米），已弃用（Decal 投影无需厚度），保留向后兼容
hitmarker_height = 0.01
# 弹孔色调（R, G, B），取值 0~255。纹理自带黑心+灰环渐变，此色做轻微偏色
hitmarker_color = [15, 15, 18]

# --- 血溅（命中角色时的血液飞溅特效）---
# 血溅颜色（R, G, B），取值 0~255。CF 鲜红 [200, 20, 20]；暗红 [140, 20, 20]
blood_color = [200, 20, 20]
# 血溅持续时间（秒），血滴飞行+淡出总时长，建议 0.3 ~ 0.6
blood_lifetime = 0.45


# ---------- UI 界面 ----------
[ui]
# 计分板隔行背景色（RGB，取值 0~255）：奇数行 / 偶数行
# 透明度不写在颜色里（由游戏内部固定），写 3 个数字即可；如需微调透明度可写第 4 个数字（0~255）
# 想把隔行变色关掉，把两行都设为 [0, 0, 0] 即可
score_row_color_odd = [122, 162, 255]
score_row_color_even = [0, 0, 0]


# ---------- 枪械属性 ----------
# 覆盖武器数据库的默认数值（默认值见 weapons/database.gd）。
# 命名规则：[武器ID]_[属性]，例如 AK47_damage = 45 表示把 AK47 伤害改为 45。
# 可用属性：damage 伤害 / fire_rate 射速(发/分) / mag 弹匣 / reserve 备弹 /
#           armor_ratio 护甲减伤系数 / head_mult 爆头倍率 / move_penalty 移动惩罚 /
#           recoil 每发累积散布半角(弧度，0.02≈1.15°；第一发不吃后坐力) / price 购买价格
[weapons]
# 全局后坐力系数：1.0=按武器表原值，0.5=减半，2.0=翻倍，影响所有枪械的后坐力。
# 注意：调太小（如 0.2）会让「每发累积量」低于衰减量(0.1/秒)，连发散布永远涨不上去，
#       所有枪都变成激光枪 —— 要整体调手感请用 0.6~1.4 这个区间。
recoil_multiplier = 0.65
# AK47_damage = 45
# AK47_fire_rate = 650
# AWP_recoil = 0.03